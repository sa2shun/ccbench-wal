name: paper

on:
  push:
    paths:
      - 'paper/**'
      - 'latexmkrc'
      - '.github/workflows/paper.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'latexmkrc'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install TeX Live packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-lang-japanese \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-science

      - name: Build IPSJ paper
        working-directory: paper
        run: latexmk main.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v5
        with:
          name: ccbench-wal-paper
          path: paper/main.pdf
          if-no-files-found: error

      - name: Commit PDF to repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/main.pdf
          if git diff --cached --quiet; then
            echo "paper/main.pdf is unchanged"
          else
            git commit -m "Update generated paper PDF"
            git push
          fi
